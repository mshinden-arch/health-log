<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdfaf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="うんこログ">

<title>うんこログ</title>

<link rel="manifest" href="./manifest.json?v=6">
<link rel="apple-touch-icon" href="./icon.png?v=6">

<style>
body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #fdfaf5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    margin: 0;
    color: #555;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
}

#overlay, #reminderOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.12);
}

#overlay { z-index: 50; }
#reminderOverlay { z-index: 300; background: rgba(0,0,0,0.25); }

.neuo-card {
    background: #fffefb;
    border-radius: 25px;
    box-shadow: 6px 6px 12px #f2efeb, -6px -6px 12px #ffffff;
    border: 1px solid rgba(255,255,255,0.5);
}

.header {
    padding: 20px;
    width: 85%;
    max-width: 350px;
    text-align: center;
    margin-top: 20px;
    z-index: 10;
}

.status-main {
    font-size: 18px;
    font-weight: 900;
    color: #5a3825;
    line-height: 1.5;
}

.status-sub {
    font-size: 12px;
    color: #888;
    margin-top: 6px;
    font-weight: bold;
}

.nav-area {
    display: flex;
    gap: 8px;
    margin: 15px 0;
    align-items: center;
    z-index: 10;
}

select {
    padding: 8px 15px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    background: #fffefb;
    box-shadow: inset 2px 2px 5px #f2efeb, inset -2px -2px 5px #ffffff;
    font-weight: bold;
    color: #555;
}

.calendar-container {
    width: 92%;
    max-width: 370px;
    padding: 15px 5px;
    margin-bottom: 20px;
    z-index: 10;
}

.weekday-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-weight: bold;
    font-size: 12px;
    margin-bottom: 10px;
    color: #bbb;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
}

.day-box {
    min-height: 58px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 8px;
    font-size: 13px;
    cursor: pointer;
    position: relative;
    z-index: 1;
    border-radius: 12px;
    -webkit-tap-highlight-color: transparent;
}

.day-box.has-poop {
    background: rgba(160, 82, 45, 0.10);
}

.today {
    border: 2px solid #78b1ff;
    background: #eef6ff !important;
}

.day-num {
    font-weight: bold;
    color: #777;
    z-index: 2;
    margin-bottom: 4px;
}

.stamps {
    font-size: 18px;
    min-height: 1.2em;
    z-index: 2;
}

#inputPanel {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fffefb;
    padding: 30px 20px 60px 20px;
    border-radius: 35px 35px 0 0;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
    text-align: center;
    z-index: 100;
    animation: slideUp 0.3s ease-out;
}

@keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
}

.panel-btn-container {
    display: flex;
    justify-content: center;
    margin-top: 15px;
}

.panel-btn {
    width: 140px;
    height: 90px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 24px;
    border: none;
    color: white;
    background: #a0522d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.active-poop {
    border: 3px solid #a0522d !important;
    background: #fffefb !important;
    color: #a0522d !important;
}

.hint {
    font-size: 12px;
    color: #999;
    margin-top: 12px;
    line-height: 1.5;
}

.reminder-card {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 82%;
    max-width: 340px;
    background: #fffefb;
    border-radius: 28px;
    padding: 26px 20px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(0,0,0,0.22);
    z-index: 310;
}

.reminder-title {
    font-size: 14px;
    color: #999;
    font-weight: bold;
    margin-bottom: 12px;
}

.reminder-message {
    font-size: 22px;
    line-height: 1.5;
    font-weight: 900;
    color: #5a3825;
    margin: 12px 0 20px;
}

.reminder-sub {
    font-size: 12px;
    line-height: 1.6;
    color: #888;
    margin-bottom: 18px;
}

.confirm-btn {
    width: 100%;
    border: none;
    border-radius: 18px;
    padding: 15px 10px;
    background: #a0522d;
    color: white;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="overlay" onclick="closePanel()"></div>

<div id="reminderOverlay"></div>
<div id="reminderCard" class="reminder-card">
    <div class="reminder-title">リマインダー</div>
    <div id="reminderMessage" class="reminder-message"></div>
    <div id="reminderSub" class="reminder-sub"></div>
    <button class="confirm-btn" onclick="confirmReminder()">確認しました</button>
</div>

<div class="header neuo-card">
    <div id="todayStatusMain" class="status-main">今日の記録：未入力</div>
    <div id="todayStatusSub" class="status-sub">出ていない日数を確認中</div>
</div>

<div class="nav-area">
    <select id="yearSelect" onchange="renderCalendar()"></select>
    <select id="monthSelect" onchange="renderCalendar()"></select>
</div>

<div class="calendar-container neuo-card">
    <div class="weekday-header">
        <div style="color:#ff807b">日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div style="color:#78b1ff">土</div>
    </div>
    <div id="calendar" class="calendar"></div>
</div>

<div id="inputPanel">
    <h3 id="selectedDateText" style="margin-top:0;">日付を選択</h3>
    <div class="panel-btn-container">
        <button id="poopBtnPanel" class="panel-btn" onclick="togglePoop()">
            <span style="font-size:26px;">💩</span>
            <span>うんこ</span>
        </button>
    </div>
    <div class="hint">押すたびに「記録あり／なし」が切り替わります</div>
</div>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js?v=6');
    });
}

const STORAGE_KEY = 'poopLogData_v1';
const REMINDER_ACK_KEY = 'poopReminderAck_v1';

let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
let reminderAck = JSON.parse(localStorage.getItem(REMINDER_ACK_KEY)) || {};
let selectedKey = null;
let activeReminderKey = null;

function init() {
    const now = new Date();
    const ySel = document.getElementById('yearSelect');
    const mSel = document.getElementById('monthSelect');

    ySel.innerHTML = '';
    mSel.innerHTML = '';

    for (let y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
        ySel.add(new Option(y + "年", y, false, y === now.getFullYear()));
    }

    for (let m = 1; m <= 12; m++) {
        mSel.add(new Option(m + "月", m, false, m === now.getMonth() + 1));
    }

    renderCalendar();
    checkReminder();
    setInterval(checkReminder, 60 * 1000);
}

function makeKey(y, m, d) {
    return `${y}-${m}-${d}`;
}

function getTodayKey() {
    const today = new Date();
    return makeKey(today.getFullYear(), today.getMonth() + 1, today.getDate());
}

function getLog(key) {
    return db[key] || { poop: false };
}

function renderCalendar() {
    const cal = document.getElementById('calendar');
    cal.innerHTML = '';

    const y = parseInt(document.getElementById('yearSelect').value);
    const m = parseInt(document.getElementById('monthSelect').value);

    const first = new Date(y, m - 1, 1).getDay();
    const last = new Date(y, m, 0).getDate();

    for (let i = 0; i < first; i++) {
        cal.appendChild(document.createElement('div'));
    }

    for (let d = 1; d <= last; d++) {
        const key = makeKey(y, m, d);
        const log = getLog(key);
        const el = document.createElement('div');

        el.className = 'day-box';

        const today = new Date();
        const isToday =
            y === today.getFullYear() &&
            m === today.getMonth() + 1 &&
            d === today.getDate();

        if (isToday) el.classList.add('today');
        if (log.poop) el.classList.add('has-poop');

        el.innerHTML = `
            <span class="day-num">${d}</span>
            <div class="stamps">${log.poop ? '💩' : ''}</div>
        `;

        el.onclick = () => openPanel(key);
        cal.appendChild(el);
    }

    updateHeader();
}

function updateHeader() {
    const todayKey = getTodayKey();
    const todayDone = db[todayKey] && db[todayKey].poop;
    const noPoopDays = getNoPoopStreakIncludingToday();

    document.getElementById('todayStatusMain').innerText =
        todayDone ? '今日の記録：💩 済み' : '今日の記録：未入力';

    document.getElementById('todayStatusSub').innerText =
        todayDone ? '今日は出ています' : `出ていない日：${noPoopDays}日目`;
}

function openPanel(key) {
    selectedKey = key;
    document.getElementById('selectedDateText').innerText = key.replace(/-/g, '/');

    const log = getLog(key);
    document.getElementById('poopBtnPanel').className =
        'panel-btn' + (log.poop ? ' active-poop' : '');

    document.getElementById('inputPanel').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
}

function closePanel() {
    document.getElementById('inputPanel').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
}

function togglePoop() {
    if (!selectedKey) return;

    if (!db[selectedKey]) {
        db[selectedKey] = { poop: false };
    }

    db[selectedKey].poop = !db[selectedKey].poop;

    if (!db[selectedKey].poop) {
        delete db[selectedKey];
    }

    save();
    renderCalendar();
    checkReminder();

    setTimeout(closePanel, 200);
}

function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function saveReminderAck() {
    localStorage.setItem(REMINDER_ACK_KEY, JSON.stringify(reminderAck));
}

function getNoPoopStreakIncludingToday() {
    const today = new Date();
    let streak = 0;

    for (let i = 0; i < 365; i++) {
        const target = new Date(today);
        target.setDate(today.getDate() - i);

        const key = makeKey(
            target.getFullYear(),
            target.getMonth() + 1,
            target.getDate()
        );

        if (db[key] && db[key].poop) {
            break;
        }

        streak++;
    }

    return streak;
}

function checkReminder() {
    const current = new Date();
    const todayKey = makeKey(
        current.getFullYear(),
        current.getMonth() + 1,
        current.getDate()
    );

    if (current.getHours() < 22) return;
    if (db[todayKey] && db[todayKey].poop) return;

    const noPoopDays = getNoPoopStreakIncludingToday();

    let message = '';
    let reminderType = '';

    if (noPoopDays === 2) {
        message = '3Aマグネシアを飲んでください';
        reminderType = 'magnesia';
    } else if (noPoopDays >= 3) {
        message = 'コーラックを飲んでください';
        reminderType = 'colac';
    } else {
        return;
    }

    const reminderKey = `${todayKey}_${reminderType}`;

    if (reminderAck[reminderKey]) return;

    activeReminderKey = reminderKey;
    showReminder(message, noPoopDays);
}

function showReminder(message, noPoopDays) {
    document.getElementById('reminderMessage').innerText = message;
    document.getElementById('reminderSub').innerText =
        `うんこなし ${noPoopDays}日目です。服用量・服用可否は薬の説明や医師・薬剤師の指示に従ってください。`;

    document.getElementById('reminderOverlay').style.display = 'block';
    document.getElementById('reminderCard').style.display = 'block';
}

function confirmReminder() {
    if (activeReminderKey) {
        reminderAck[activeReminderKey] = true;
        saveReminderAck();
    }

    document.getElementById('reminderOverlay').style.display = 'none';
    document.getElementById('reminderCard').style.display = 'none';
    activeReminderKey = null;
}

init();
</script>

</body>
</html>
